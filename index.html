<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гэрлээ ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #c9697a;
  --rose2: #a04d5e;
  --blush: #f4d4da;
  --cream: #fdf6f0;
  --deep: #150b0e;
  --mid: #1f1014;
  --gold: #c9a96e;
  --gold2: #a0834a;
  --muted: #7a5660;
  --text: #e8d0d6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--deep);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Stars canvas */
#starCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* Screens */
.screen {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}

/* Gift Screen */
#giftScreen {
  background: radial-gradient(ellipse 70% 60% at 50% 35%, #3a1525 0%, transparent 70%),
              radial-gradient(ellipse 100% 80% at 50% 100%, #1a0a10 0%, transparent 60%),
              #0e070a;
}

/* ... (gift styles remain the same - keeping it short) ... */
.gift-ring, .gift-icon, .gift-title, .open-btn, .orn { /* same as before */ }

/* MAIN CONTENT */
#mainContent {
  display: none;
  background: radial-gradient(ellipse 80% 50% at 50% 0%, #2a1020 0%, transparent 60%),
              radial-gradient(ellipse 60% 40% at 80% 80%, #1a0d18 0%, transparent 50%),
              #0e070a;
}

.content-wrap {
  max-width: 580px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 44px;
}

/* Slider - NEW HORIZONTAL SLIDE */
.slider-wrap { width: 100%; overflow: hidden; border-radius: 12px; }

.slider-frame {
  width: 100%;
  aspect-ratio: 3/2;
  max-height: 360px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(201,105,122,0.15),
              0 30px 80px rgba(0,0,0,0.7);
  border-radius: 12px;
}

.slider-container {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.8s cubic-bezier(0.32, 0.72, 0, 1); /* Smooth & premium feel */
  will-change: transform;
}

.slider-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  flex-shrink: 0;
  border-radius: 12px;
}

/* Vignette */
.slider-frame::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(14,7,10,0.6) 100%);
  pointer-events: none;
  z-index: 2;
}

/* Dots */
.slide-meta {
  display: flex;
  justify-content: center;
  margin-top: 14px;
}

.slide-dots {
  display: flex;
  gap: 8px;
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  transition: all 0.4s ease;
  cursor: pointer;
}

.dot.active {
  background: var(--rose);
  transform: scale(1.4);
  width: 22px;
  border-radius: 6px;
}

/* Other styles remain same */
.card, .letter-btn, #letterBox, .footer-sig { /* same as your original */ }

/* Fade in */
.fade-in { animation: fadeUp .9s cubic-bezier(.22,1,.36,1) both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>

<!-- Gift Screen -->
<div id="giftScreen" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center;gap:36px;">
    <div class="gift-ring" onclick="openGift()">
      <div class="gift-icon">🎁</div>
    </div>
    <div style="text-align:center;">
      <p class="gift-title">Зөвхөн <em>чамдаа</em> зориулсан<br>нэгэн зүйл..</p>
    </div>
    <div class="orn"><span>✦</span></div>
    <button class="open-btn" onclick="openGift()">Нээх</button>
  </div>
</div>

<!-- Main Content -->
<div id="mainContent" class="screen">
  <div class="content-wrap">
    <div class="title-block fade-in">
      <p class="eyebrow">✦ &nbsp; &nbsp; ✦</p>
      <h1>Төрсөн Өдрийн<br>Мэнд, Гэрлээ
        <span>Өнөөдрийн энэ өдөр бүхэлдээ чинийх минь юм шүү</span>
      </h1>
    </div>

    <div class="divider fade-in" style="animation-delay:.12s">
      <div class="divider-diamond"></div>
      <div class="divider-diamond" style="opacity:.3;transform:rotate(45deg) scale(.6)"></div>
      <div class="divider-diamond"></div>
    </div>

    <!-- Horizontal Slider -->
    <div class="slider-wrap fade-in" style="animation-delay:.2s">
      <div class="slider-frame">
        <div class="slider-container" id="sliderContainer"></div>
      </div>
      <div class="slide-meta">
        <div class="slide-dots" id="dots"></div>
      </div>
    </div>

    <div class="card fade-in" style="animation-delay:.3s">
      <span class="card-icon">🎂</span>
      <p>Өнөөдрийн энэ өдөр бүхэлдээ чинийх.</p>
      <br>
      <p>Өнөөдрийн энэ өдөр бүхэлдээ чинийх минь юм шүү</p>
    </div>

    <button class="letter-btn fade-in" style="animation-delay:.52s" onclick="showLetter()">
      💌 &nbsp; Надаас нэг зүйл...
    </button>

    <div id="letterBox">
      <span class="quote-mark">❝</span>
    </div>
    <p class="footer-sig fade-in" style="animation-delay:.6s">— Лхагваа ❤️</p>
  </div>
</div>

<script>
/* Star Canvas (same as before) */
const sc = document.getElementById('starCanvas');
const cx = sc.getContext('2d');
let W, H, stars = [], floaters = [];
// ... (keep your original star code here) ...

/* ====================== HORIZONTAL SLIDER ====================== */
const images = [
  "02fad2fb-8fe0-4f75-960f-3a915ca087da.jpg",
  "e2c0d77a-2dc6-4f16-9395-354a31017448.jpg",
  "e540f58b-fbf3-4464-a9a5-37c81061ed2d.jpg",
  "e7586a9c-29f7-4c80-af44-aa54019cc9a9.jpg",
  "f1a3508f-8d2a-46f8-a116-8d25fcd4a262.jpg"
];

let cur = 0;
let autoSlide;
let isDragging = false;
let startX = 0;
let scrollLeft = 0;

const container = document.getElementById('sliderContainer');
const dotsEl = document.getElementById('dots');

function buildSlider() {
  container.innerHTML = '';
  dotsEl.innerHTML = '';

  images.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    container.appendChild(img);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToSlide(i);
    dotsEl.appendChild(dot);
  });

  updateSliderPosition();
}

function updateSliderPosition() {
  container.style.transform = `translateX(-${cur * 100}%)`;
}

function goToSlide(index) {
  cur = index;
  updateSliderPosition();
  updateDots();
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === cur);
  });
}

function nextSlide() {
  cur = (cur + 1) % images.length;
  updateSliderPosition();
  updateDots();
}

function prevSlide() {
  cur = (cur - 1 + images.length) % images.length;
  updateSliderPosition();
  updateDots();
}

// Touch Events
container.addEventListener('touchstart', e => {
  isDragging = true;
  startX = e.touches[0].clientX;
  clearInterval(autoSlide);
});

container.addEventListener('touchend', e => {
  isDragging = false;
  const diff = startX - e.changedTouches[0].clientX;
  
  if (Math.abs(diff) > 80) {
    if (diff > 0) nextSlide();
    else prevSlide();
  }
  
  autoSlide = setInterval(nextSlide, 3500);
});

// Initialize
buildSlider();
autoSlide = setInterval(nextSlide, 3500);

/* Gift Open */
function openGift() {
  const gs = document.getElementById('giftScreen');
  gs.style.transition = 'opacity .6s ease';
  gs.style.opacity = '0';
  setTimeout(() => {
    gs.style.display = 'none';
    const main = document.getElementById('mainContent');
    main.style.display = 'flex';
    main.style.opacity = '1';
  }, 600);
}

/* Letter Typewriter */
function showLetter() {
  const box = document.getElementById('letterBox');
  if (box.dataset.shown) return;
  box.dataset.shown = '1';
  box.style.display = 'block';
  box.style.animation = 'fadeUp .7s cubic-bezier(.22,1,.36,1) both';

  const lines = [
    'Сайн уу, Гэрлээ.', '', 
    'Холдсон хугацаа урт байсан ч чиний талаар бодоогүй өдөр байгаагүй.',
    '', 'Чи яг өөрийнхөөрөө гэрэлтэж явахыг — тэр инээмсэглэлийг чинь хэн ч авч чадахгүй гэдгийг мэддэг.',
    '', 'Өнгөрсөн бидний түүх биш, харин чиний ирж буй хамгийн сайхан хуудаснууд руу чин сэтгэлээсээ баяр хүргэж байна.',
    '', 'Төрсөн өдрийн мэнд.', 'Төгсөлтийн баярын мэнд.'
  ];

  const text = lines.join('\n');
  box.innerHTML = '<span class="quote-mark">❝</span>';
  const span = document.createElement('span');
  box.appendChild(span);

  let i = 0;
  function type() {
    if (i < text.length) {
      const ch = text.charAt(i);
      span.innerHTML += ch === '\n' ? '<br>' : ch;
      i++;
      setTimeout(type, ch === '\n' ? 80 : 28);
    }
  }
  type();
}
</script>
</body>
</html>
